name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install
      # The inspector pulls the whole FluentUI tree into the bundle graph —
      # rollup OOMs at the default 2 GB node heap on smaller runners.
      - run: bun run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - run: bun run typecheck
      - run: bun test src
      - run: bun install -g oxlint
      - run: oxlint src
      # Zig jobs embed the same dist instead of rebuilding it per runner.
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: app/web/dist
          if-no-files-found: error

  format:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      # The project's own Zig sources must be formatted. `zig-pkg` holds
      # vendored dependencies (not ours to format), so it is left out.
      - name: zig fmt --check
        run: zig fmt --check app cli core test tools main.zig build.zig

  test:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-test-${{ matrix.os }}-${{ hashFiles('build.zig', 'build.zig.zon', 'vendor/**') }}
          restore-keys: zig-test-${{ matrix.os }}-
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: app/web/dist
      # Artifact mtimes can predate checkout — build.zig's staleness check
      # compares against dist/index.html, so keep it newest.
      - run: touch app/web/dist/index.html
      - run: zig build test --summary all

  fuzz:
    # The malformed-GLB corpus: every file must be handled cleanly (an
    # error, never a crash or a hang). The corpus is generated, not stored.
    needs: frontend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-fuzz-${{ hashFiles('build.zig', 'build.zig.zon', 'vendor/**') }}
          restore-keys: zig-fuzz-
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: app/web/dist
      - run: touch app/web/dist/index.html
      - run: zig build -Dapp=false --summary all
      - run: python3 test/fuzz_corpus.py
      - run: sh test/fuzz_run.sh

  build-windows:
    needs: frontend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-test-windows-${{ hashFiles('build.zig', 'build.zig.zon', 'vendor/**') }}
          restore-keys: zig-test-windows-
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: app/web/dist
      # Artifact mtimes can predate checkout — build.zig's staleness check
      # compares against dist/index.html, so keep it newest.
      - run: touch app/web/dist/index.html
      # The test suite runs on Windows too: the app backend is
      # platform-independent, and a Windows-only regression should not wait
      # for the next release.
      - run: zig build test --summary all
      # Explicit gnu target: same cross config the release matrix ships, and
      # it does not depend on the runner's MSVC environment.
      - run: zig build -Dtarget=x86_64-windows-gnu --summary all
      # Stage WebView2Loader.dll + license next to the GUI exe (nanoui loads
      # it dynamically; without it the GUI falls back even with the runtime
      # installed). Must run before the smoke so zig-out/bin matches the ZIP.
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/fetch-webview2.ps1
      # Runtime smoke without opening a window: CLI-only args that print and
      # exit. The script launches via Start-Process -Wait / Process.WaitForExit,
      # which really wait for a GUI-subsystem exe (plain `&`/cmd do not
      # reliably report its exit code). Covers stdout/stderr, `>`/`2>`
      # redirects, pipes, error text, and exit codes.
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/test-windows.ps1
