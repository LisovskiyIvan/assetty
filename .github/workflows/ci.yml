name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install
      # The inspector pulls the whole FluentUI tree into the bundle graph —
      # rollup OOMs at the default 2 GB node heap on smaller runners.
      - run: bun run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - run: bun run typecheck
      - run: bun install -g oxlint
      - run: oxlint src

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      # app/web/dist is committed, so no bun needed here.
      - run: zig build test --summary all

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      # Explicit gnu target: same cross config the release matrix ships, and
      # it does not depend on the runner's MSVC environment.
      - run: zig build -Dtarget=x86_64-windows-gnu --summary all
