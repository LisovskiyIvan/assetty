name: release

on:
  push:
    tags: ["v*"]

defaults:
  run:
    shell: bash

permissions:
  contents: write

jobs:
  # The web dist is platform-independent: build it once, embed everywhere.
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install
        working-directory: app/web
      # FluentUI (inspector peers) bloats the rollup graph — bigger heap.
      - run: bun run build
        working-directory: app/web
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: app/web/dist
          if-no-files-found: error

  build:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-macos.12.0
            os: macos
            arch: arm64
            ext: zip
          - runner: windows-latest
            target: x86_64-windows-gnu
            os: windows
            arch: x64
            ext: zip
          - runner: ubuntu-22.04
            target: x86_64-linux-gnu
            os: linux
            arch: x64
            ext: tar.gz
          - runner: ubuntu-22.04
            target: aarch64-linux-gnu
            os: linux
            arch: arm64
            ext: tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      # Vendor C++ (basisu dominates compile time) only changes when vendor/
      # or build.zig change; warm caches cut the zig step to minutes.
      - uses: actions/cache@v4
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zig-release-${{ matrix.target }}-${{ hashFiles('build.zig', 'build.zig.zon', 'vendor/**') }}
          restore-keys: zig-release-${{ matrix.target }}-
      # dist from the frontend job; download-artifact stamps fresh mtimes, so
      # build.zig's staleness check embeds it as-is (no bun needed here).
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: app/web/dist
      # Artifact mtimes can predate checkout — build.zig's staleness check
      # compares against dist/index.html, so keep it newest.
      - run: touch app/web/dist/index.html
      - run: zig build -Dtarget=${{ matrix.target }} -Dversion=${GITHUB_REF_NAME#v} -Drepo=${{ github.repository }} --summary all
      - name: Fetch WebView2 loader DLL (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: ./tools/fetch-webview2.ps1
      - name: Verify Windows CLI streams and exit codes
        if: matrix.os == 'windows'
        shell: pwsh
        run: ./tools/test-windows.ps1
      - run: sh tools/package.sh "${GITHUB_REF_NAME#v}" "${{ matrix.os }}" "${{ matrix.arch }}" "${{ matrix.ext }}"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: assetty-${{ matrix.os }}-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # Only the platform archives: downloading every artifact would also
      # drop the web dist into `out/`, where it would be published as a
      # release asset and listed in the manifest.
      - uses: actions/download-artifact@v4
        with:
          pattern: assetty-*
          path: out
          merge-multiple: true
      # The signing step runs through the build system, which wants the web
      # dist to be present; take the artifact the frontend job built.
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: app/web/dist
      - run: touch app/web/dist/index.html
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: python3 tools/manifest.py "${GITHUB_REF_NAME#v}" out
      # Sign the manifest with the release key: the app only trusts a
      # manifest whose detached signature verifies against the public key
      # compiled into it. The seed lives in the ASSETTY_UPDATE_SEED secret
      # and never in the repository.
      - name: Sign the manifest
        env:
          ASSETTY_UPDATE_SEED: ${{ secrets.ASSETTY_UPDATE_SEED }}
        run: |
          if [ -z "$ASSETTY_UPDATE_SEED" ]; then
            echo "::error::ASSETTY_UPDATE_SEED is not set — the manifest cannot be signed and the updater would refuse it"
            exit 1
          fi
          zig build sign-manifest -- out/manifest.json
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
